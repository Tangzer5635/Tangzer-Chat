name: tangzer

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tangzer
      POSTGRES_USER: ${DB_USERNAME:-tangzer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tangzer}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Pas de port publié : seul le backend (dans Docker) parle à la base.
    # Pour lancer le backend hors Docker, voir docker-compose.dev.yml.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/tangzer
      DB_USERNAME: ${DB_USERNAME:-tangzer}
      DB_PASSWORD: ${DB_PASSWORD:-tangzer}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-the-env-file-this-is-not-a-real-secret-0123456789}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-604800000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      APP_DEMO_DATA: ${APP_DEMO_DATA:-true}
      STORAGE_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data
    restart: unless-stopped

  frontend:
    build: ./tangzer-front
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # Ajoute l'IP ou le nom du serveur au certificat auto-signé, ex : IP:192.168.1.20
      TLS_EXTRA_SAN: ${TLS_EXTRA_SAN:-}
    volumes:
      - ./certs:/etc/nginx/certs
    restart: unless-stopped

volumes:
  db-data:
  uploads:
