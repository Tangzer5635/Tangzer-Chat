spring:
  application:
    name: Chat-Tangzer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tangzer}
    username: ${DB_USERNAME:tangzer}
    password: ${DB_PASSWORD:tangzer}
  jpa:
    # Le schéma est géré par Flyway (src/main/resources/db/migration) ; Hibernate vérifie seulement.
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
  # Derrière nginx : respecte X-Forwarded-Proto / X-Forwarded-Host.
  forward-headers-strategy: framework

app:
  # Crée les comptes de démonstration au démarrage.
  demo-data: ${APP_DEMO_DATA:true}
  # Origines autorisées pour le CORS et le WebSocket (séparées par des virgules).
  allowed-origins: ${ALLOWED_ORIGINS:*}
  security:
    jwt:
      # À surcharger en production avec la variable JWT_SECRET (32 caractères minimum).
      secret: ${JWT_SECRET:dev-only-secret-change-me-please-at-least-64-characters-long-xx}
      # 7 jours par défaut.
      expiration: ${JWT_EXPIRATION_MS:604800000}
