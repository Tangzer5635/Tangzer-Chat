map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/tangzer.crt;
    ssl_certificate_key /etc/nginx/certs/tangzer.key;

    # Taille maximale des fichiers envoyés (photos).
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # API REST
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # WebSocket STOMP
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Fichiers générés par Vite : leur nom contient un hash, on peut les garder en cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application monopage : toutes les autres routes renvoient index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
